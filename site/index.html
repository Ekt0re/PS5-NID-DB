<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PS5 NID Database</title>
<meta name="description" content="Searchable catalog of PS5 NIDs and their implementation status in AnyPS5, KytyPS5 and SharpEmu.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1020'/%3E%3Cpath d='M8 22V10l8 12V10m8 12V10' fill='none' stroke='%236ea8ff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<div id="progress" class="progress" aria-hidden="true"><div id="progress-bar"></div></div>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 22V10l8 12V10m8 12V10"/></svg>
    <div class="brand-text">
      <h1>PS5 NID Database</h1>
      <p>AnyPS5 &middot; KytyPS5 &middot; SharpEmu</p>
    </div>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="search" type="search" placeholder="Search a NID or a function name" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search a NID or a function name" disabled>
    <kbd id="kbd">/</kbd>
  </div>

  <div class="actions">
    <a class="btn" id="repo-link" href="https://github.com/Ekt0re/PS5-NID-DB" target="_blank" rel="noopener" aria-label="Open the repository on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      <span>Ekt0re/PS5-NID-DB</span>
    </a>
    <button class="btn icon" id="theme" type="button" aria-label="Toggle light and dark theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
  </div>
</header>

<div class="filters">
  <label class="field">
    <span>Library</span>
    <select id="f-lib" disabled><option value="">All libraries</option></select>
  </label>
  <label class="field">
    <span>Emulator</span>
    <select id="f-emu" disabled>
      <option value="">Any emulator</option>
      <option value="anyps5">AnyPS5</option>
      <option value="kyty">KytyPS5</option>
      <option value="sharpemu">SharpEmu</option>
    </select>
  </label>
  <label class="field">
    <span>Status</span>
    <select id="f-status" disabled>
      <option value="">Any status</option>
      <option value="implemented">Implemented</option>
      <option value="stub">Stub</option>
      <option value="unknown">Unknown</option>
      <option value="not_implemented">Not implemented</option>
    </select>
  </label>
  <button class="btn ghost" id="reset" type="button" hidden>Reset</button>
  <button class="btn ghost push" id="overview-toggle" type="button" aria-expanded="false" aria-controls="overview">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>
    <span>Progress</span>
  </button>
</div>

<section id="overview" class="overview" hidden aria-label="Implementation progress">
  <div class="overview-stats" id="stats"></div>
  <div class="overview-chart">
    <div id="chart" class="chart"></div>
    <div id="legend" class="legend"></div>
  </div>
</section>

<main class="panes" id="panes">
  <section class="list-pane" id="list-pane" aria-label="Functions">
    <div class="count-bar"><span id="count">Loading&hellip;</span></div>
    <div id="list" class="list" tabindex="0">
      <div id="spacer" class="spacer"></div>
      <div id="rows" class="rows"></div>
      <div id="empty" class="empty" hidden>
        <strong>No matches</strong>
        <span>Try a shorter name, a partial NID, or reset the filters.</span>
      </div>
    </div>
    <div id="loader" class="loader">
      <div class="loader-card">
        <div class="spinner" id="spinner"></div>
        <strong id="loader-title">Downloading data</strong>
        <span id="loader-text">Starting&hellip;</span>
        <div class="bar"><div id="loader-bar"></div></div>
        <button class="btn" id="retry" type="button" hidden>Try again</button>
      </div>
    </div>
  </section>

  <section class="detail-pane" id="detail-pane" aria-label="Function details">
    <div class="detail-head">
      <button class="btn icon back" id="back" type="button" aria-label="Back to the list">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <span class="detail-head-title">Details</span>
    </div>
    <div id="detail" class="detail">
      <div class="placeholder">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
        <strong>Pick a function</strong>
        <span>Its NIDs and the status in each emulator show up here.</span>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <span id="meta">PS5 NID Database</span>
  <span class="footer-links">
    <a href="https://github.com/Ekt0re/PS5-NID-DB" target="_blank" rel="noopener">Repository</a>
    <a href="https://github.com/Ekt0re/PS5-NID-DB/issues" target="_blank" rel="noopener">Report an issue</a>
  </span>
</footer>

</body>
</html>
